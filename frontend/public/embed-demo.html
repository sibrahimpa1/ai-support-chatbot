<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 16px; color: #1e293b; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Any website</h1>
    <p>This plain HTML page loads the support widget with a single script tag:</p>
    <p><code>&lt;script src="/embed.js" defer&gt;&lt;/script&gt;</code></p>
    <p>Click the bubble in the bottom-right corner.</p>
    <script src="/embed.js" defer></script>
  </body>
</html>
